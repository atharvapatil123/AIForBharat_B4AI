[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    property: Property-based tests
    integration: Integration tests
    slow: Slow running tests

# Coverage options
addopts =
    --strict-markers
    --verbose
    --cov=healthcare_insurance_platform
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Hypothesis settings
hypothesis_profile = default

[hypothesis]
max_examples = 100
deadline = None
