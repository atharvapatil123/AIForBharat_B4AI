version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: healthcare_insurance_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: healthcare_insurance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  app:
    build: .
    container_name: healthcare_insurance_app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/healthcare_insurance
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./healthcare_insurance_platform:/app/healthcare_insurance_platform
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn healthcare_insurance_platform.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
